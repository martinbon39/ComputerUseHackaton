<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holo · process</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--fg:#f4f6fa;--dim:#a9b3c1;--faint:#4a525e;--push:#ffd75e;--hold:#ff4fd8;--attn:#6fd3ff;--ok:#7dffb0;--no:#ff4f6a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}canvas:active{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:clamp(13px,1.05vw,20px);letter-spacing:.02em;color:var(--fg);opacity:0;will-change:transform,opacity;text-shadow:0 0 8px #0b0d10,0 0 3px #0b0d10,0 0 1px #000}
.lb.l{color:#c3ccd8;font-size:clamp(12px,.9vw,17px)}
.lb.a{color:var(--attn)}
.lb.p{color:var(--push)}
.lb.m{color:var(--hold)}
.lb.big{font-size:clamp(15px,1.3vw,24px)}
.lb .s{color:var(--dim)}
#panel{position:fixed;top:4vh;right:2.2vw;width:clamp(280px,26vw,520px);border-left:1px solid #2a3038;padding:.4vw 1vw .8vw 1.2vw;pointer-events:none;background:linear-gradient(90deg,rgba(11,13,16,.6),rgba(11,13,16,.88))}
#chap{font-size:clamp(12px,.9vw,17px);color:var(--dim);letter-spacing:.18em;text-transform:uppercase}
#title{font-size:clamp(22px,2.1vw,40px);font-weight:500;margin:.35em 0 .7em;letter-spacing:.01em}
#lines{display:flex;flex-direction:column;gap:.62em}
.ln{font-size:clamp(14px,1.12vw,21px);line-height:1.35;color:var(--fg);opacity:0;transform:translateY(6px);transition:opacity .7s,transform .7s}
.ln.on{opacity:1;transform:none}
.ln .k{color:var(--dim)}
.ln .y{color:var(--push)}.ln .m{color:var(--hold)}.ln .c{color:var(--attn)}.ln .g{color:var(--ok)}.ln .r{color:var(--no)}
#src{position:fixed;left:2.2vw;bottom:3.2vh;font-size:clamp(11px,.75vw,14px);color:#7a8494;max-width:60vw;pointer-events:none}
#cap{position:fixed;left:2.2vw;top:4vh;background:rgba(11,13,16,.8);padding:.3em .6em;max-width:56vw;font-size:clamp(14px,1.25vw,24px);line-height:1.4;color:var(--fg);pointer-events:none;opacity:0;transition:opacity .8s}
#cap .k{color:var(--dim)}#cap .m{color:var(--hold)}#cap .y{color:var(--push)}
#bar{position:fixed;left:2.2vw;right:2.2vw;bottom:1.4vh;height:2px;display:flex;gap:6px;pointer-events:none}
#bar i{flex:1;background:#262c35;position:relative;overflow:hidden}
#bar i b{position:absolute;inset:0;width:0;background:#9aa4b2}
#big{position:fixed;left:2.2vw;right:calc(24vw + 5vw);top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.85),rgba(0,0,0,0) 75%);padding:3vh 0}
#big:empty{background:none}
.bn{opacity:0;transform:translateY(14px);transition:opacity 1s,transform 1s}
.bn.on{opacity:1;transform:none}
.bn .v{font-size:clamp(30px,3.6vw,72px);font-weight:500;letter-spacing:-.01em;line-height:1.05}
.bn .v .m{color:var(--hold)}.bn .v .y{color:var(--push)}.bn .v .g{color:var(--ok)}.bn .v .k{color:var(--dim);font-size:.55em}
.bn .d{margin-top:.8em;font-size:clamp(12px,.95vw,18px);color:var(--fg);line-height:1.45}
.bn .d .k{color:var(--dim)}
#ci{position:fixed;left:2.2vw;bottom:9vh;width:min(54vw,980px);pointer-events:none;opacity:0;transition:opacity 1s}
#ci text{font-family:'IBM Plex Mono',ui-monospace,monospace}
#paused{position:fixed;right:2.2vw;bottom:3.2vh;font-size:clamp(12px,.85vw,16px);color:var(--dim);opacity:0}
#help{position:fixed;right:2.2vw;bottom:5.6vh;font-size:clamp(11px,.72vw,14px);color:#6d7685;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="cap"></div>
<div id="panel"><div id="chap"></div><div id="title"></div><div id="lines"></div></div>
<div id="big"></div>
<svg id="ci" viewBox="0 0 1120 250"></svg>
<div id="src"></div>
<div id="paused">paused · space · R to resume</div>
<div id="bar"></div>
<div id="help">drag · rotate &nbsp; wheel · zoom &nbsp; right-drag · pan &nbsp; double-click · details &nbsp; ←/→ · chapter &nbsp; space · pause &nbsp; R · resume</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
const IMG={s1:"__IMG_step_1__",s3:"__IMG_step_3__",s5:"__IMG_step_5__",s6:"__IMG_step_6__",c12:"__IMG_calc_12__",c17:"__IMG_calc_17__"};

// ---------- renderer ----------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0d10);
scene.fog=new THREE.FogExp2(0x0b0d10,0.0072);
const camera=new THREE.PerspectiveCamera(42,1,0.05,500);
const composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.0,.5,.78);composer.addPass(bloom);
function resize(){renderer.setSize(innerWidth,innerHeight,false);composer.setPixelRatio(Math.min(devicePixelRatio,2));composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.setViewOffset(innerWidth,innerHeight,innerWidth*.15,0,innerWidth,innerHeight);camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
const win=(t,a,b,f=0.8)=>sm((t-a)/f)*(1-sm((t-b)/f)); // 0..1 window with fades
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const hashR=(s)=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return ((h>>>0)%100000)/100000};

// glow sprite texture
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.75)');r.addColorStop(.6,'rgba(255,255,255,.12)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);const t=new THREE.CanvasTexture(c);return t})();
const ADD=THREE.AdditiveBlending;
const C={push:0xffd75e,hold:0xff4fd8,attn:0x7fdcff,dnet:0xb4c0d6,white:0xffffff,ok:0x7dffb0,no:0xff4f6a};

// ---------- network geometry ----------
const NL=32, SP=2.2, PW=6.2, PH=4.4;
const ATTN=[3,7,11,15,19,23,27,31]; // config.json layer_types (full_attention), full_attention_interval=4
const isAttn=i=>ATTN.includes(i);
const LX=i=>(i-15.5)*SP;
const X0=LX(0), X1=LX(31);
const layers=[];
function gridGeom(){const p=[];const st=0.4;for(let y=-PH/2;y<=PH/2+1e-6;y+=st){p.push(0,y,-PW/2,0,y,PW/2)}for(let z=-PW/2;z<=PW/2+1e-6;z+=st){p.push(0,-PH/2,z,0,PH/2,z)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));return g}
const GG=gridGeom();
const borderG=new THREE.BufferGeometry().setFromPoints([V(0,-PH/2,-PW/2),V(0,-PH/2,PW/2),V(0,PH/2,PW/2),V(0,PH/2,-PW/2),V(0,-PH/2,-PW/2)]);
const planeG=new THREE.PlaneGeometry(PW,PH);
for(let i=0;i<NL;i++){
  const col=new THREE.Color(isAttn(i)?C.attn:C.dnet);
  const g=new THREE.Group();g.position.x=LX(i);scene.add(g);
  const fillM=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.025,depthWrite:false,side:THREE.DoubleSide,blending:ADD});
  const fill=new THREE.Mesh(planeG,fillM);fill.rotation.y=Math.PI/2;g.add(fill);
  const gridM=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.08,depthWrite:false,blending:ADD});
  g.add(new THREE.LineSegments(GG,gridM));
  const borM=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.45,depthWrite:false,blending:ADD});
  g.add(new THREE.Line(borderG,borM));
  const n=64,pp=[];seed=101+i*37;
  for(let k=0;k<n;k++)pp.push(0,(rnd()-.5)*PH*.9,(rnd()-.5)*PW*.92);
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(pp,3));
  const ptM=new THREE.PointsMaterial({color:col,map:glowTex,size:.36,transparent:true,opacity:.55,depthWrite:false,blending:ADD});
  g.add(new THREE.Points(pg,ptM));
  layers.push({g,fillM,gridM,borM,ptM,base:col.clone(),hl:0,hlc:0,tint:null,tintAmt:0,dim:0,vis:1});
}
function layerReset(){for(const L of layers){L.hl=0;L.tintAmt=0;L.tint=null;L.dim=0}}
function setLayerVis(v){for(const L of layers)L.vis=v}
const tmpC=new THREE.Color();
function updateLayers(dt){
  for(const L of layers){
    L.hlc+= (L.hl-L.hlc)*Math.min(1,dt*3);
    L.tac=(L.tac||0)+((L.tintAmt||0)-(L.tac||0))*Math.min(1,dt*3);
    L.dc=(L.dc||0)+((L.dim||0)-(L.dc||0))*Math.min(1,dt*3);
    L.vc=(L.vc===undefined?1:L.vc)+(L.vis-(L.vc===undefined?1:L.vc))*Math.min(1,dt*2);
    const k=(1+L.hlc*2.2)*(1-L.dc*.8)*L.vc;
    tmpC.copy(L.base);if(L.tint)tmpC.lerp(L.tint,L.tac);
    for(const m of [L.fillM,L.gridM,L.borM,L.ptM])m.color.copy(tmpC);
    L.fillM.opacity=.055*k+.07*L.tac*L.vc;L.gridM.opacity=Math.min(1,.22*k);L.borM.opacity=Math.min(1,.8*k);L.ptM.opacity=Math.min(1,.9*k);
  }
}

// residual stream
const streamM=new THREE.LineBasicMaterial({color:0x9fc4ff,transparent:true,opacity:.35,blending:ADD,depthWrite:false});
const streamLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(X0-4,0,0),V(X1+4,0,0)]),streamM);scene.add(streamLine);
const NP=420;const pPos=new Float32Array(NP*3);const pSeed=[];seed=3;
for(let k=0;k<NP;k++){pSeed.push({x:X0-4+rnd()*(X1-X0+8),r:Math.pow(rnd(),2)*.32,a:rnd()*6.28,v:.6+rnd()*.8})}
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
const pM=new THREE.PointsMaterial({color:0xbcd6ff,map:glowTex,size:.26,transparent:true,opacity:.0,depthWrite:false,blending:ADD});
scene.add(new THREE.Points(pGeo,pM));
let streamSpeed=4, streamOp=0, streamOpC=0;
function updateStream(dt){
  streamOpC+=(streamOp-streamOpC)*Math.min(1,dt*2);
  pM.opacity=1*streamOpC;streamM.opacity=.6*streamOpC;
  for(let k=0;k<NP;k++){const s=pSeed[k];s.x+=dt*streamSpeed*s.v;if(s.x>X1+4)s.x=X0-4;s.a+=dt*.6;
    pPos[k*3]=s.x;pPos[k*3+1]=Math.sin(s.a)*s.r;pPos[k*3+2]=Math.cos(s.a)*s.r}
  pGeo.attributes.position.needsUpdate=true;
}

// tied-embedding arc
const arcCurve=new THREE.QuadraticBezierCurve3(V(X1+4,0,0),V(0,13,-2),V(X0-4,0,0));
const arcM=new THREE.LineDashedMaterial({color:0x9fc4ff,dashSize:.5,gapSize:.35,transparent:true,opacity:0,depthWrite:false});
const arcLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(arcCurve.getPoints(120)),arcM);arcLine.computeLineDistances();scene.add(arcLine);

// glowing node helper
function node(pos,color,size){const m=new THREE.SpriteMaterial({map:glowTex,color,transparent:true,opacity:0,depthWrite:false,blending:ADD});const s=new THREE.Sprite(m);s.position.copy(pos);s.scale.set(size,size,1);scene.add(s);return {s,m,op:0,opc:0,size}}
const nodes=[];function mkNode(p,c,s){const n=node(p,c,s);nodes.push(n);return n}
function updateNodes(dt,T){for(const n of nodes){n.opc+=(n.op-n.opc)*Math.min(1,dt*3);n.m.opacity=n.opc;const pul=1+.08*Math.sin(T*3+n.s.position.x);n.s.scale.set(n.size*pul,n.size*pul,1)}}

const ANS=V(X1+5.2,1.0,0), CLK=V(X1+5.2,-1.0,0);
const ansN=mkNode(ANS,C.push,1.5), clkN=mkNode(CLK,0x9aa4b2,1.0);

// special units — positions decorative, labels from paper/data/pod_astra/circuit/REPORT.md
function unitPos(L,id){const r1=hashR('y'+L+'_'+id),r2=hashR('z'+L+'_'+id);return V(LX(L),(r1-.5)*PH*.75,(r2-.5)*PW*.8)}
const HEADS=[{L:19,h:15,d:'−2.06'},{L:23,h:1,d:'−3.88'},{L:31,h:14,d:'−3.56'}];
const NEUR={30:[8,216,345,1012,1418],31:[302,315,1591,1855,3099]};
const units=[];
for(const h of HEADS){const p=unitPos(h.L,'h'+h.h);units.push({p,kind:'head',n:mkNode(p,C.white,.75),h})}
for(const L of [30,31])for(const id of NEUR[L]){const p=unitPos(L,'n'+id);units.push({p,kind:'neur',n:mkNode(p,C.push,.42),L,id})}
// connections unit -> answer (yellow = pushes toward "answer")
function curveLine(a,b,color,lift=1.2){const mid=a.clone().lerp(b,.5);mid.y+=lift;const c=new THREE.QuadraticBezierCurve3(a,mid,b);const g=new THREE.BufferGeometry().setFromPoints(c.getPoints(48));const m=new THREE.LineBasicMaterial({color,transparent:true,opacity:0,depthWrite:false,blending:ADD});const l=new THREE.Line(g,m);scene.add(l);return {l,m,g,op:0,opc:0,draw:0,drawc:0}}
const links=[];function mkLink(a,b,c,lift){const k=curveLine(a,b,c,lift);links.push(k);return k}
const unitLinks=units.map(u=>mkLink(u.p,ANS,C.push,u.kind==='head'?1.6:.8));
function updateLinks(dt){for(const k of links){k.opc+=(k.op-k.opc)*Math.min(1,dt*3);k.drawc+=(k.draw-k.drawc)*Math.min(1,dt*1.6);k.m.opacity=Math.min(1,k.opc*1.3);k.g.setDrawRange(0,Math.floor(49*k.drawc))}}

// block brackets (ceiling test, AlphaEdit range)
function bracket(a,b,color){const x0=LX(a)-.6,x1=LX(b)+.6,y=-PH/2-.5,z=PW/2+.2;const g=new THREE.BufferGeometry().setFromPoints([V(x0,y+.35,z),V(x0,y,z),V(x1,y,z),V(x1,y+.35,z)]);const m=new THREE.LineBasicMaterial({color,transparent:true,opacity:0,depthWrite:false,blending:ADD});scene.add(new THREE.Line(g,m));return {m,op:0,opc:0,c:V((x0+x1)/2,y-.45,z)}}
const BR={early:bracket(0,11,C.white),mid:bracket(12,23,C.hold),late:bracket(24,31,C.white),all:bracket(0,31,0x9aa4b2)};
function updateBr(dt){for(const k in BR){const b=BR[k];b.opc+=(b.op-b.opc)*Math.min(1,dt*3);b.m.opacity=b.opc}}

// steering injections (magenta = holds back the stop)
function inject(L){const top=V(LX(L),PH/2+3.2,0),bot=V(LX(L),0,0);const g=new THREE.BufferGeometry().setFromPoints([top,bot]);const m=new THREE.LineBasicMaterial({color:C.hold,transparent:true,opacity:0,depthWrite:false,blending:ADD});scene.add(new THREE.Line(g,m));const n=mkNode(top,C.hold,.7);return {m,n,op:0,opc:0,top}}
const INJ={16:inject(16),24:inject(24),31:inject(31),18:inject(18)};
function updateInj(dt){for(const k in INJ){const j=INJ[k];j.opc+=(j.op-j.opc)*Math.min(1,dt*3);j.m.opacity=j.opc*.9;j.n.op=j.op}}

// activation-space clouds (positions decorative; counts = verif_study 268 final screens: 66 false, 202 true)
const CL_C=V(LX(14),0,0);
function gauss(){return Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.283*rnd())}
function cloud(n,shift,color,sd){seed=shift>0?991:313;const p=[];for(let k=0;k<n;k++)p.push(CL_C.x+gauss()*sd*.5,gauss()*sd+shift*.0,gauss()*sd+shift);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));const m=new THREE.PointsMaterial({color,map:glowTex,size:.4,transparent:true,opacity:0,depthWrite:false,blending:ADD});const P=new THREE.Points(g,m);scene.add(P);return {P,m,op:0,opc:0,col:new THREE.Color(color)}}
const cTrue=cloud(202,-.35,C.push,1.05), cFalse=cloud(66,.45,C.hold,1.0);
function updateClouds(dt,T,colorMix){for(const c of [cTrue,cFalse]){c.opc+=(c.op-c.opc)*Math.min(1,dt*2);c.m.opacity=c.opc*.9;tmpC.set(0xdfe6ef).lerp(c.col,colorMix);c.m.color.copy(tmpC);c.P.rotation.x=Math.sin(T*.15)*.15}}

// screens (VM captures)
const texL=new THREE.TextureLoader();const TX={};for(const k in IMG){TX[k]=texL.load(IMG[k]);TX[k].minFilter=THREE.LinearFilter;TX[k].anisotropy=8}
function screen(pos,ry,sc){const m=new THREE.MeshBasicMaterial({map:TX.s1,color:0xc4c4c4,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false,fog:false});const s=new THREE.Mesh(new THREE.PlaneGeometry(19.2,10.8),m);s.position.copy(pos);s.rotation.y=ry;s.scale.setScalar(sc);scene.add(s);
  const fg=new THREE.BufferGeometry().setFromPoints([V(-9.6,-5.4,0),V(9.6,-5.4,0),V(9.6,5.4,0),V(-9.6,5.4,0),V(-9.6,-5.4,0)]);const fm=new THREE.LineBasicMaterial({color:0x8f9bb3,transparent:true,opacity:0,fog:false});s.add(new THREE.Line(fg,fm));s.updateMatrixWorld(true);
  return {s,m,fm,op:0,opc:0,key:'s1'}}
const VM_X=X0-13; const vm=screen(V(VM_X,0,0),-Math.PI/2,1);
const GD_P=V(X1+15,2.2,-5); const gs=screen(GD_P,-.25,.72);
// pixel (u,v) of a 1920x1080 capture -> world point on that screen
const sl=(S,u,v)=>S.s.localToWorld(V((u/1920-.5)*19.2,(.5-v/1080)*10.8,.03));
function box(S,u0,v0,u1,v1,color){const a=V((u0/1920-.5)*19.2,(.5-v0/1080)*10.8,.04),b=V((u1/1920-.5)*19.2,(.5-v1/1080)*10.8,.04);const g=new THREE.BufferGeometry().setFromPoints([V(a.x,a.y,a.z),V(b.x,a.y,a.z),V(b.x,b.y,a.z),V(a.x,b.y,a.z),V(a.x,a.y,a.z)]);const m=new THREE.LineBasicMaterial({color,transparent:true,opacity:0,fog:false});S.s.add(new THREE.Line(g,m));return {m,op:0,opc:0}}
const vmBox=box(vm,488,1048,884,1077,C.hold);
const vmBox2=box(vm,600,32,1370,60,C.hold);
const gdBox=box(gs,265,1030,432,1062,C.no);
function updateScreens(dt){for(const S of [vm,gs]){S.opc+=(S.op-S.opc)*Math.min(1,dt*2.5);S.m.opacity=S.opc;S.fm.opacity=S.opc*.5;if(S.m.map!==TX[S.key]){S.m.map=TX[S.key];S.m.needsUpdate=true}}for(const b of [vmBox,vmBox2,gdBox]){b.opc+=(b.op-b.opc)*Math.min(1,dt*3);b.m.opacity=b.opc}}

// guard + escalation nodes
const GUARD=V(X1+10,0,0), H4=V(X1+11,-4.5,4);
