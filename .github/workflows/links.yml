name: links
# Every relative link and #anchor of the Markdown files resolves (see reproduce/check_links.py for the scope).
on:
  push:
    paths:
      - "**.md"
      - "llms.txt"
      - "reproduce/check_links.py"
      - ".github/workflows/links.yml"
  workflow_dispatch:
concurrency:
  group: links
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 reproduce/check_links.py
