name: quickstart
# Reproduces the published numbers on every push, on CPU, with no secret: the same commands as the README quickstart.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: (a) + (b) + (c)
        run: bash jury_kit/quickstart.sh
      - name: guard_live.py lists the 268 episodes (no network call)
        run: |
          python jury_kit/guard_live.py --list > episodes.txt
          test "$(wc -l < episodes.txt)" -eq 268
          head -3 episodes.txt
